[project]
name = "protein-mpnn-jax"
version = "0.1.0"
description = "A JAX implementation of ProteinMPNN."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beartype>=0.21.0",
    "einops>=0.8.1",
    "gemmi>=0.7.3",
    "jax>=0.7.2",
    "jaxtyping>=0.3.3",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "pytest>=8.4.2",
    "ruff>=0.13.2",
]


[tool.ruff.lint]
extend-select = [
    "I", # isort
]
extend-ignore = [
    "F722", # https://docs.kidger.site/jaxtyping/faq/
]
