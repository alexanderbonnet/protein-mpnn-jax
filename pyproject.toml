[project]
name = "protein-mpnn-jax"
version = "0.1.0"
description = "A JAX implementation of ProteinMPNN."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "einops>=0.8.1",
    "equinox>=0.13.1",
    "gdown>=5.2.0",
    "gemmi>=0.7.3",
    "jax>=0.8.0",
    "jaxtyping>=0.3.3",
    "loguru>=0.7.3",
    "torch>=2.9.0",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "ruff>=0.13.2",
    "types-tqdm>=4.67.0.20250809",
]


[tool.ruff.lint]
extend-select = [
    "I", # isort
]
extend-ignore = [
    "F722", # https://docs.kidger.site/jaxtyping/faq/
]
